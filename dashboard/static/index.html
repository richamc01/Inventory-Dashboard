<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware Lot Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='9' rx='1.5' fill='%232a78d6'/%3E%3Crect x='5' y='13' width='6' height='1.5' fill='%232a78d6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Hardware Lot</h1>
    <span id="stamp" class="muted"></span>
  </div>
  <nav id="tabs" role="tablist">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#sales" data-tab="sales">Sales</a>
    <a href="#listings" data-tab="listings">Listings</a>
    <a href="#inventory" data-tab="inventory">Computer Inventory</a>
    <a href="#fleet" data-tab="fleet">Computer Fleet</a>
    <a href="#hardware" data-tab="hardware">Hardware Inventory</a>
    <a href="#hwfleet" data-tab="hwfleet">Hardware Fleet</a>
    <a href="#notes" data-tab="notes">Notes</a>
    <a href="#data" data-tab="data">Data</a>
    <a href="#instructions" data-tab="instructions">Instructions</a>
  </nav>
  <button id="refresh" type="button">Refresh</button>
</header>
<div id="banner" hidden></div>
<main id="main"><p class="muted pad">Loading…</p></main>
<aside id="drawer" hidden aria-label="Details">
  <div class="drawer-head">
    <div id="drawer-title"></div>
    <button id="drawer-close" type="button" aria-label="Close">✕</button>
  </div>
  <div id="drawer-body"></div>
</aside>
<div id="scrim" hidden></div>
<div id="tip" role="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
